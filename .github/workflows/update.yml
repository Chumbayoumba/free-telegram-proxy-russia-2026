name: Обновить список прокси

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-proxies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch proxies checked from Russia
        run: python3 scripts/update.py
      - name: Commit
        run: |
          git config user.name "Egor"
          git config user.email "104503229+Chumbayoumba@users.noreply.github.com"
          git add README.md proxies.txt proxy-list.txt mtproto.json tg.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Рабочие прокси для Telegram: обновлено $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M') МСК"
          git push
